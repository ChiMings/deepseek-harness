name: Sync upstream (deepseek-ai/deepseek-harness)

# 每天把上游 master 合并进本 fork。
#
# 为什么不用 POST /repos/{owner}/{repo}/merge-upstream：那个接口只能用
# workflow 里的 GITHUB_TOKEN 调，一旦上游这轮改到了 .github/workflows/*，
# 就会被 GitHub 拒掉（422 refusing to allow a GitHub App to create or update
# workflow ... without `workflows` permission），而 workflow 的 permissions:
# 里根本写不出 workflows 这个键——所以它每次上游动了 CI 文件就必然失败。
#
# 现在改成 git 合并 + 带 workflows 权限的 PAT 推送（仓库 secret
# UPSTREAM_SYNC_TOKEN）。PAT 过期后这里会在 checkout/fetch 阶段 401/403，
# 届时换一个新 token 写进 secret 即可。

on:
  # TODO(2026-11-25): secret UPSTREAM_SYNC_TOKEN 就位、并手动跑通一次之后，
  # 把下面两行注释放开恢复每天 03:00 自动同步。
  # schedule:
  #   # 03:00 Asia/Shanghai（前一天 19:00 UTC）
  #   - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只检查是否有更新，不执行合并"
        type: boolean
        default: false

# 推送用 PAT，GITHUB_TOKEN 这里只需要读；不给写权限。
permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fork master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Merge upstream
        id: merge
        env:
          UPSTREAM_REPO: deepseek-ai/deepseek-harness
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          git config user.name  "upstream-sync-bot"
          git config user.email "upstream-sync-bot@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags --prune upstream master

          UP=$(git rev-parse upstream/master)
          LOCAL=$(git rev-parse HEAD)
          echo "upstream = $UP"
          echo "fork     = $LOCAL"

          if [ "$UP" = "$LOCAL" ]; then
            echo "### 已是最新，无需同步。" >> "$GITHUB_STEP_SUMMARY"
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge-base --is-ancestor "$UP" HEAD; then
            echo "### 上游提交已在 fork 中（fork 领先），无需同步。" >> "$GITHUB_STEP_SUMMARY"
            echo "status=ahead-only" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$(echo "$DRY_RUN" | tr '[:upper:]' '[:lower:]')" = "true" ]; then
            echo "### dry_run：上游有新提交 ${UP:0:10}，本次不合并。" >> "$GITHUB_STEP_SUMMARY"
            echo "status=dry-run" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --no-ff --no-commit upstream/master || true

          if git ls-files -u | grep -q .; then
            CONFLICTED=$(git diff --name-only --diff-filter=U | sed 's/^/  - /')
            git merge --abort
            {
              echo "### 合并冲突，未推送"
              echo ""
              echo "上游改动与本 fork 的本地修改撞在同一处："
              echo '```'
              echo "$CONFLICTED"
              echo '```'
              echo ""
              echo "本地处理：\`git remote add upstream https://github.com/${UPSTREAM_REPO}.git\`"
              echo "\`git fetch upstream && git merge upstream/master\`，解完冲突再 \`git push\`。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            echo "::warning::上游合并冲突，未推送，详见 job summary"
            exit 0
          fi

          CHANGED=$(git diff --cached --name-only | wc -l)
          git commit -q -m "chore(sync): merge upstream ${UPSTREAM_REPO}@${UP:0:10} [skip ci]"
          # [skip ci] 是故意的：同步提交不需要再触发一遍 push 工作流。
          git push origin master

          {
            echo "### 同步成功"
            echo ""
            echo "- 上游：\`${UPSTREAM_REPO}@${UP:0:10}\`"
            echo "- 合并提交：\`$(git rev-parse --short HEAD)\`"
            echo "- 变更文件：${CHANGED} 个"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "status=merged" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

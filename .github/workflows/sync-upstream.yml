name: Sync upstream (deepseek-ai/deepseek-harness)

# 每天把上游 master 合并进本 fork。
#
# 为什么不用 POST /repos/{owner}/{repo}/merge-upstream：那个接口只能用 workflow
# 里的 GITHUB_TOKEN 调，一旦上游这轮改到 .github/workflows/*，就会被 GitHub 拒掉
# （422 refusing to allow a GitHub App to create or update workflow ... without
# `workflows` permission），而 workflow 的 permissions: 里根本写不出 workflows
# 这个键——所以只要上游动了 CI 文件就必然失败，每天一封失败邮件。
#
# 现在改成 git 合并 + 推送，两种凭据自动适配：
#   1) 仓库 secret UPSTREAM_SYNC_TOKEN（带 contents + workflows 写的 PAT）优先，
#      能连 .github/workflows 一起同步；
#   2) 没有该 secret 时退回 github.token，此时 GitHub 会拒绝推送 workflow 改动，
#      脚本自动把这些文件还原成 fork 自己的版本再推送，其余文件照常同步，
#      并在 job summary 里标明「本次跳过 .github/workflows」。
#
# 所以 secret 可有可无：有了就全量同步，没有也不会报错。

on:
  schedule:
    # 03:00 Asia/Shanghai（前一天 19:00 UTC）
    - cron: "*/10 * * * *"  # TEMP: 联调中，跑通后改回 0 19 * * *
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只检查是否有更新，不执行合并"
        type: boolean
        default: false

# github.token 回退路径需要 contents: write 才能推；（有 PAT 时这条用不上）
permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fork master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Merge upstream
        id: merge
        env:
          UPSTREAM_REPO: deepseek-ai/deepseek-harness
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          git config user.name  "upstream-sync-bot"
          git config user.email "upstream-sync-bot@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags --prune upstream master

          UP=$(git rev-parse upstream/master)
          LOCAL=$(git rev-parse HEAD)
          echo "upstream = $UP"
          echo "fork     = $LOCAL"

          if [ "$UP" = "$LOCAL" ]; then
            echo "### 已是最新，无需同步。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if git merge-base --is-ancestor "$UP" HEAD; then
            echo "### 上游提交已在 fork 中（fork 领先），无需同步。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$(echo "$DRY_RUN" | tr '[:upper:]' '[:lower:]')" = "true" ]; then
            echo "### dry_run：上游有新提交 ${UP:0:10}，本次不合并。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          PRE_MERGE=$(git rev-parse HEAD)
          git merge --no-ff --no-commit upstream/master || true

          if git ls-files -u | grep -q .; then
            CONFLICTED=$(git diff --name-only --diff-filter=U | sed 's/^/  - /')
            git merge --abort
            {
              echo "### 合并冲突，未推送"
              echo ""
              echo "上游改动与本 fork 的本地修改撞在同一处："
              echo '```'
              echo "$CONFLICTED"
              echo '```'
              echo ""
              echo "本地处理：\`git remote add upstream https://github.com/${UPSTREAM_REPO}.git\`，"
              echo "\`git fetch upstream && git merge upstream/master\`，解完冲突再 \`git push\`。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::上游合并冲突，未推送，详见 job summary"
            exit 0
          fi

          git commit -q -m "chore(sync): merge upstream ${UPSTREAM_REPO}@${UP:0:10} [skip ci]"

          ERR=$(mktemp)
          if git push origin HEAD:master 2>"$ERR"; then
            MODE="full"
          else
            if ! grep -qiE 'workflows?.?permission|refusing to allow' "$ERR"; then
              cat "$ERR" >&2
              echo "### 推送失败（非 workflows 权限问题）" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            # github.token 没有 workflows 权限：把 CI 定义还原成 fork 自己的版本再推
            echo "::notice::当前凭据没有 workflows 权限，本次跳过 .github/workflows 的更新"
            git rm -rq --ignore-unmatch .github/workflows
            git checkout "$PRE_MERGE" -- .github/workflows
            git commit -q --amend -m "chore(sync): merge upstream ${UPSTREAM_REPO}@${UP:0:10} (skip .github/workflows) [skip ci]"
            git push origin HEAD:master 2>"$ERR" || { cat "$ERR" >&2; exit 1; }
            MODE="skip-workflows"
          fi
          rm -f "$ERR"

          {
            echo "### 同步成功（模式：${MODE}）"
            echo ""
            echo "- 上游：\`${UPSTREAM_REPO}@${UP:0:10}\`"
            echo "- 合并提交：\`$(git rev-parse --short HEAD)\`"
            echo "- 变更文件：$(git diff --stat "${PRE_MERGE}" HEAD | tail -1)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MODE" = "skip-workflows" ]; then
            echo ""
            echo "> 想让 \`.github/workflows\` 也跟上游同步：加一个仓库 secret" >> "$GITHUB_STEP_SUMMARY"
            echo "> \`UPSTREAM_SYNC_TOKEN\`（contents + workflows 写的 PAT），下次运行自动切换全量模式。" >> "$GITHUB_STEP_SUMMARY"
          fi
